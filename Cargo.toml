[package]
name = "sportanalytics"
version = "0.3.0"
edition = "2021"
rust-version = "1.71"
authors = ["Gunnar Karlsson <gunnar.h.karlsson@gmail.com>"]
description = """
Sport analytics in Rust. Running: Daniels VDOT, race prediction, training zones, USATF MLDR 2025 age grading. Cycling: FTP, critical power, Coggan zones, Martin road power–speed. Swimming: CSS, training zones, race prediction, World Aquatics points. Designed so other sports can be added later.
"""
license = "MIT"
readme = "README.md"
repository = "https://github.com/GunnarKarlsson/sportanalytics"
homepage = "https://github.com/GunnarKarlsson/sportanalytics"
documentation = "https://docs.rs/sportanalytics"
keywords = ["running", "cycling", "swimming", "css", "vdot"]
categories = ["science"]
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    # Citation only; raw AgeGrade.* RunScore files stay in git, not the crate.
    "data/age_grade/2025/SOURCE.txt",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["derive", "std"] }

[dev-dependencies]
serde_json = "1"

[[example]]
name = "from_5k"
path = "examples/running/from_5k.rs"

[[example]]
name = "age_grade"
path = "examples/running/age_grade.rs"

[[example]]
name = "from_20min"
path = "examples/cycling/from_20min.rs"

[[example]]
name = "from_tt"
path = "examples/cycling/from_tt.rs"

[[example]]
name = "from_400_200"
path = "examples/swimming/from_400_200.rs"

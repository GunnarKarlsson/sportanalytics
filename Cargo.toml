[package]
name = "sportanalytics"
version = "0.1.1"
edition = "2021"
rust-version = "1.71"
authors = ["Gunnar Karlsson <gunnar.h.karlsson@gmail.com>"]
description = "Running analytics in Rust: Daniels VDOT, race-time prediction, training zones, and USATF MLDR 2025 age grading. Designed so other sports can be added later."
license = "MIT"
readme = "README.md"
repository = "https://github.com/GunnarKarlsson/sportanalytics"
homepage = "https://github.com/GunnarKarlsson/sportanalytics"
documentation = "https://docs.rs/sportanalytics"
keywords = ["running", "vo2max", "vdot", "age-grade", "race-prediction"]
categories = ["science"]
include = [
    "src/**/*",
    "examples/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    # Citation only; raw AgeGrade.* RunScore files stay in git, not the crate.
    "data/age_grade/2025/SOURCE.txt",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["derive", "std"] }

[dev-dependencies]
serde_json = "1"
